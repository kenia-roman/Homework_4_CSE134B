<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>form</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="form-container">
    
        <form action="https://httpbin.org/post" method="post">
            <p>
                <label for="name">Name: (Required)</label>
                <input type="text" id="name" name="user_name" autocomplete="name" required minlength="1" maxlength="100"/>
            </p>
            <p>
                <label for="email">Email: (Required)</label>
                <input type="email" id="email" name="user_email" autocomplete="email" required/>
            </p>
            <p>
                <label for="msg">Message: (Required 10-1000 characters)</label>
                <textarea id="msg" name="user_message" required minlength="10" maxlength="1000"></textarea>
            </p>

            <p class="button">
                <button type="submit">Send Message</button>
            </p>

            <input type="hidden" name="possible_bot" value="true"/>
        </form>
    </div>
  </body>
</html>
