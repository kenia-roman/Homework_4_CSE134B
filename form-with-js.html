
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style2.css">
    <script src="form.js" defer></script>
</head>

<body>
    <div class="form-container">

        <form id="contact-form"
              action="https://httpbin.org/post"
              method="post">

            <p>
                <label for="name">Name: (Required)</label>
                <input
                    type="text"
                    id="name"
                    name="user_name"
                    autocomplete="name"
                    required
                    minlength="1"
                    maxlength="100"
                    aria-describedby="name-error">
                <span id="name-error" class="field-error"></span>
            </p>

            <p>
                <label for="email">Email: (Required)</label>
                <input
                    type="email"
                    id="email"
                    name="user_email"
                    autocomplete="email"
                    required
                    aria-describedby="email-error">
                <span id="email-error" class="field-error"></span>
            </p>

            <p>
                <label for="msg">
                    Comment: (Required 10-1000 characters)
                </label>
                <textarea
                    id="msg"
                    name="user_message"
                    required
                    minlength="10"
                    maxlength="1000"
                    aria-describedby="comment-error info-message"
                ></textarea>
                <span id="comment-error" class="field-error"></span>
            </p>

            <p id="error-message" aria-live="polite"></p>

            <p id="info-message"
               class="js-only"
               aria-live="polite"
               hidden></p>

            <p class="button">
                <button type="submit">Send Message</button>
            </p>

            <input type="hidden"
                   name="possible_bot"
                   value="true">

            <input type="hidden"
                   id="form-errors"
                   name="form-errors"
                   value="[]">
        </form>
    </div>
</body>
</html>
